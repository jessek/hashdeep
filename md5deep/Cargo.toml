[package]
name = "md5deep"
version = "5.0.0"
edition = "2024"

[dependencies]
walkdir = "2.5.0"
md5 = "0.8.0"
sha1 = "0.10"
sha2 = "0.10"
xxhash-rust = { version = "0.8.15", features = ["xxh3"] }
blake3 = "1.8.2"
serde = { version = "1.0.225", features = ["derive"] }
serde_json = "1.0.145"
clap = { version = "4.5", features = ["derive"] }
